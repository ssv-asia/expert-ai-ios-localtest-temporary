nodeLinker: node-modules

# Bundle the Yarn 4 binary so `yarn` delegates to it even where only Yarn 1 is
# on PATH and Corepack is not enabled (e.g. EAS Build images). Without this the
# build fails instantly with "packageManager defines yarn@4.9.2 but global Yarn
# is 1.22.22 / Corepack must be enabled".
yarnPath: .yarn/releases/yarn-4.9.2.cjs
