name: iOS local test IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-platform-fixes-20261114

jobs:
  build-ios:
    runs-on: macos-15
    env:
      EXPO_PUBLIC_GITHUB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GITHUB_CLIENT_ID }}
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Set iOS deployment target required by ML Kit
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'ios/Podfile.properties.json';
          const properties = JSON.parse(fs.readFileSync(path, 'utf8'));
          properties['ios.deploymentTarget'] = '16.0';
          fs.writeFileSync(path, `${JSON.stringify(properties, null, 2)}\n`);
          NODE

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build Release Pods
        run: >-
          xcodebuild -quiet -project ios/Pods/Pods.xcodeproj
          -target Pods-ExpertAI -configuration Release -sdk iphoneos
          CODE_SIGNING_ALLOWED=NO build

      - name: Build the Release app without a signing profile
        run: >-
          xcodebuild -quiet -project ios/ExpertAI.xcodeproj
          -target ExpertAI -configuration Release -sdk iphoneos
          CODE_SIGNING_ALLOWED=NO PRODUCT_BUNDLE_IDENTIFIER=com.local.expertai build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="ios/build/Release-iphoneos/ExpertAI.app"
          test -d "$APP_PATH"
          plutil -lint "$APP_PATH/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          test "$BUNDLE_ID" = "com.local.expertai"
          MINIMUM_IOS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")
          echo "Built bundle: $BUNDLE_ID"
          echo "Minimum iOS: $MINIMUM_IOS"
          mkdir -p release-localtest/Payload
          cp -R "$APP_PATH" release-localtest/Payload/ExpertAI.app
          (cd release-localtest && /usr/bin/zip -qry ExpertAI-for-AltServer.ipa Payload)
          /usr/bin/unzip -tq release-localtest/ExpertAI-for-AltServer.ipa
          shasum -a 256 release-localtest/ExpertAI-for-AltServer.ipa > release-localtest/ExpertAI-for-AltServer.ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ExpertAI-for-AltServer
          path: release-localtest/ExpertAI-for-AltServer.ipa*
          if-no-files-found: error
          retention-days: 3
